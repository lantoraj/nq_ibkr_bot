services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway
    restart: always
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: "no"
      TWOFA_TIMEOUT_ACTION: "restart"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      AUTO_RESTART_TIME: "01:15 AM"
      TIME_ZONE: "America/New_York"
      TWS_ACCEPT_INCOMING: "accept"
      EXISTING_SESSION_DETECTED_ACTION: "primary"
    ports:
      # Localhost-only bindings so API and optional VNC are never exposed to the public internet
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:5900:5900"

  nq-bot:
    build: .
    container_name: nq-ibkr-bot
    restart: unless-stopped
    network_mode: "service:ib-gateway"
    depends_on:
      - ib-gateway
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./journal/combo_e_mnq:/app/journal
      - ./report:/app/report
    command: >
      python -u main.py
      --mode ${TRADING_MODE:-paper}
      --symbol MNQ
      --bar-size "${BOT_BAR_SIZE:-2 mins}"
      --contracts ${BOT_CONTRACTS:-1}
      --max-daily-loss ${BOT_MAX_DAILY_LOSS:-250.0}
      --premarket-min-atr 22.0
      --bot-name "NQ Quant Bot v4.1 (Combo E · MNQ)"
      --host 127.0.0.1
      --port ${IB_GATEWAY_PORT:-4002}
      --client-id 101

  nq-bot-combo-d:
    build: .
    container_name: nq-ibkr-bot-combo-d
    restart: unless-stopped
    network_mode: "service:ib-gateway"
    depends_on:
      - ib-gateway
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./journal/combo_d_nq:/app/journal
    command: >
      python -u main.py
      --mode ${TRADING_MODE:-paper}
      --symbol NQ
      --bar-size "${BOT_BAR_SIZE:-2 mins}"
      --contracts ${BOT_CONTRACTS:-1}
      --max-daily-loss 2500.0
      --premarket-min-atr 16.0
      --bot-name "NQ Quant Bot v4.1 (Combo D · NQ)"
      --host 127.0.0.1
      --port ${IB_GATEWAY_PORT:-4002}
      --client-id 102

  report-web:
    image: nginx:alpine
    container_name: nq-strategy-report
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./report:/usr/share/nginx/html:ro
